[project]
name = "rag-grounded"
version = "0.1.0"
description = "RAG over technical docs that cites every claim and refuses when it can't"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_grounded*"]
